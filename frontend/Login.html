<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
</head>
<body>
    <h1>Adminq Login</h1>
    <p>Welcome to the admin login page. Please sign in to manage attendance.</p>
    <form id="LoginForm">
        User ID: <input type="text" id="login_userId" required><br><br>
        Password: <input type="password" id="login_password" required><br><br>
        <button type="submit" id="loginBtn">Login</button>
    </form>
    <hr>

    <button onclick="window.location.href='AttendancePage.html'">Go to Attendance Page</button>

    

    <script src="src/Login.js"></script>
</body>
</html>
